name: precompile

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      exgboost_target:
        description: "Precompiled artifact variant to build"
        required: true
        default: "cpu"
        type: choice
        options:
          - cpu
          - cuda80
          - cuda86
          - cuda89
          - cuda90
          - cuda80_86_89_90

permissions:
  contents: write

jobs:
  linux:
    if: github.event_name == 'push' || github.event.inputs.exgboost_target == 'cpu'
    name: Linux Erlang/OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}}
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: "prod"
      CC: gcc-14
      CXX: g++-14
      EXGBOOST_TARGET: cpu
    strategy:
      matrix:
        include:
          - otp: "28.3"
            elixir: "1.18.4"
          - otp: "28.3"
            elixir: "1.19.5"
          - otp: "29.0.2"
            elixir: "1.20.2"
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential automake autoconf pkg-config bc m4 unzip zip \
            cmake ninja-build gcc-14 g++-14 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-riscv64-linux-gnu g++-riscv64-linux-gnu
      - name: Mix Test
        run: |
          mix deps.get
          MIX_ENV=test mix test
      - name: Create precompiled library
        run: |
          export ELIXIR_MAKE_CACHE_DIR=$(pwd)/cache
          mkdir -p "${ELIXIR_MAKE_CACHE_DIR}"
          EXGBOOST_TARGET=cpu mix elixir_make.precompile
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            cache/*.tar.gz
            cache/*.tar.gz.sha256

  macos:
    if: github.event_name == 'push' || github.event.inputs.exgboost_target == 'cpu'
    runs-on: macos-15
    name: Mac (ARM) Erlang/OTP 29.0.2 / Elixir 1.20.2
    env:
      MIX_ENV: "prod"
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
      - name: Install libomp
        run: |
          brew install libomp
          mix local.hex --force
          mix local.rebar --force
      - name: Mix Test
        run: |
          mix deps.get
          MIX_ENV=test mix test
      - name: Create precompiled library
        run: |
          export ELIXIR_MAKE_CACHE_DIR=$(pwd)/cache
          mkdir -p "${ELIXIR_MAKE_CACHE_DIR}"
          EXGBOOST_TARGET=cpu mix elixir_make.precompile
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ 'cache/*aarch64*.tar.gz' }}
            ${{ 'cache/*aarch64*.tar.gz.sha256' }}

  linux-cuda:
    name: Linux CUDA ${{ github.event.inputs.exgboost_target }} Erlang/OTP 29.0.2 / Elixir 1.20.2
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.exgboost_target != 'cpu'
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:13.2.1-devel-ubuntu24.04
    env:
      MIX_ENV: "prod"
      CC: gcc-14
      CXX: g++-14
      EXGBOOST_TARGET: ${{ github.event.inputs.exgboost_target }}
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git unzip xz-utils \
            cmake ninja-build gcc-14 g++-14
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 140
          update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 140
          update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-14 140
          update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-14 140
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Create CUDA precompiled library
        run: |
          mix deps.get
          export ELIXIR_MAKE_CACHE_DIR=$(pwd)/cache
          mkdir -p "${ELIXIR_MAKE_CACHE_DIR}"
          mix elixir_make.precompile
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            cache/*.tar.gz
            cache/*.tar.gz.sha256
